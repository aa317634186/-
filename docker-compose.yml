services:
  cloud-player:
    build: .
    container_name: cloud-player
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT:-3000}
      CACHE_DIR: ${CACHE_DIR:-/data/cache}
      MAX_CACHE_GB: ${MAX_CACHE_GB:-20}
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-180}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-180}
      MAX_TORRENT_FILE_MB: ${MAX_TORRENT_FILE_MB:-20}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      PEER_PORT: ${PEER_PORT:-6881}
      DHT_PORT: ${DHT_PORT:-6881}
      MAX_PEERS: ${MAX_PEERS:-200}
      UPLOAD_LIMIT_KBPS: ${UPLOAD_LIMIT_KBPS:-32}
      ARIA2_RPC_URL: http://aria2:6800/jsonrpc
      ARIA2_SECRET: ${ARIA2_SECRET:-cloud-player-secret}
      # Set a long random token before exposing the service to the Internet.
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    volumes:
      - ./data:/data
    depends_on:
      - aria2

  aria2:
    image: p3terx/aria2-pro:latest
    container_name: cloud-player-aria2
    restart: unless-stopped
    environment:
      RPC_SECRET: ${ARIA2_SECRET:-cloud-player-secret}
      RPC_PORT: 6800
      LISTEN_PORT: 6881
      DISK_CACHE: 64M
      BT_MAX_PEERS: 200
      ENABLE_DHT: "true"
      ENABLE_TRACKER: "true"
      ENABLE_LPD: "true"
      RPC_LISTEN_ALL: "true"
      SEEDING_INTERVAL: 0
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2-alpine
    container_name: cloud-player-caddy
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cloud-player

volumes:
  caddy_data:
  caddy_config:
