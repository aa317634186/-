services:
  cloud-player:
    build: .
    container_name: cloud-player
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CACHE_DIR: /data/cache
      MAX_CACHE_GB: 20
      CACHE_TTL_MINUTES: 120
      CLEANUP_INTERVAL_MINUTES: 5
      MAX_TORRENT_FILE_MB: 20
      FFMPEG_PATH: ffmpeg
      # Set a long random token before exposing the service to the Internet.
      AUTH_TOKEN: ""
    volumes:
      - ./data:/data
