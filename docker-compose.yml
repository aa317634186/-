services:
  cloud-player:
    build: .
    container_name: cloud-player
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT:-3000}
      CACHE_DIR: ${CACHE_DIR:-/data/cache}
      MAX_CACHE_GB: ${MAX_CACHE_GB:-20}
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-180}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-180}
      MAX_TORRENT_FILE_MB: ${MAX_TORRENT_FILE_MB:-20}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      PEER_PORT: ${PEER_PORT:-6881}
      DHT_PORT: ${DHT_PORT:-6881}
      MAX_PEERS: ${MAX_PEERS:-200}
      UPLOAD_LIMIT_KBPS: ${UPLOAD_LIMIT_KBPS:-32}
      QBT_URL: http://qbittorrent:8080
      QBT_USERNAME: ${QBT_USERNAME:-}
      QBT_PASSWORD: ${QBT_PASSWORD:-}
      # Set a long random token before exposing the service to the Internet.
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    volumes:
      - ./data:/data
    depends_on:
      - qbittorrent

  qbittorrent:
    build: ./qbittorrent
    container_name: cloud-player-qbittorrent
    restart: unless-stopped
    environment:
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      TZ: ${TZ:-Asia/Singapore}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./data/qbittorrent:/config
      - ./data:/data

  caddy:
    image: caddy:2-alpine
    container_name: cloud-player-caddy
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cloud-player

volumes:
  caddy_data:
  caddy_config:
